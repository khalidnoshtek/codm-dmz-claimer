# LOCKED — the daemon is hard-coded to drive AVD `CODM_Pixel9` only. These
# two fields are kept for backwards compatibility but are ignored at runtime:
#   - target_avd MUST equal "CODM_Pixel9" or the daemon refuses to run.
#   - adb_serial is ignored (warns and falls back to the locked AVD).
# To genuinely point this project at a different AVD, edit lib/adb.py
# LOCKED_AVD — a deliberate code change, not a config tweak.
target_avd: "CODM_Pixel9"
adb_serial: ""

# CODM Android package id. Global = com.activision.callofduty.shooter
# Garena (SEA) = com.garena.game.codm — change to match your install.
package: "com.activision.callofduty.shooter"

# Activity to launch. .MainActivity is the usual entry point; can be left null
# to use `monkey -p <package>` which picks the default launcher activity.
activity: null

# Template-matching confidence threshold (0..1). Templates below this score
# are treated as "not found". Lower = more permissive (more false matches).
match_threshold: 0.82

# Daemon loop period in seconds. 3h = 10800. Two of the rewards refresh every
# 3-4h, the bigger one every 8h — running every 3h means each reward is claimed
# within at most 1h of becoming available.
loop_period_seconds: 10800

# Random jitter added/subtracted from each loop interval (seconds). Helps avoid
# a perfectly periodic signature and gives the cooldowns room to actually tick over.
loop_jitter_seconds: 600

# Per-tap settling delay after every input event (seconds).
tap_settle_seconds: 1.2

# Per-screen wait after navigating (seconds) — lets animations finish before
# we try to match templates.
screen_settle_seconds: 2.5

# Maximum seconds to wait for a template to appear before giving up on a step.
step_timeout_seconds: 20

# If true, log "would tap (x,y)" instead of actually tapping. Useful while
# tuning templates.
dry_run: false

# At end of each cycle, force-stop CODM AND shut down the AVD entirely.
# Saves Mac RAM/CPU during the multi-hour wait between cycles. The next
# cycle's start re-launches the AVD via ensure_avd_running, which waits
# for boot + post-boot services, then cold-launches CODM with retries.
# Cold-start cost is ~2 min, dwarfed by the 3-4h sleep, so this is a clear
# win. Set to false if you'd rather keep the AVD warm (faster cycles,
# more idle RAM use).
shutdown_between_cycles: true

# Schedule the Mac to wake itself just before the next cycle (via `pmset
# schedule wake`). Lets the Mac sleep between cycles for real power savings
# while still waking to claim. Requires a one-time sudoers rule that grants
# passwordless sudo for `pmset schedule *` — see lib/wake.py for details.
# Without the rule, this is a silent no-op and the Mac must stay awake.
# Only fires when the inter-cycle sleep is > 10 minutes (no point sleeping
# the Mac for a few minutes).
sleep_mac_between_cycles: true

# Hard ceiling on the daemon's between-cycle sleep when OCR found ALL 3 timers
# (high-confidence schedule). Default 7200s (2h) trades extra cycles for
# guaranteed coverage.
max_sleep_seconds: 7200

# Tighter cap when OCR found FEWER than 3 timers — we can't trust the schedule
# because the min cooldown we read might be from a long-cooldown card while a
# shorter one was missed. Re-check sooner. 3600s (1h) is a balance between
# catching missed short timers and not over-polling. Tighten to ~1200 if you
# care more about claiming-asap-after-expiry than about cycle count.
low_confidence_sleep_seconds: 3600

# OCR retry: if read_cooldowns finds fewer than the expected 3 timers, take
# additional screenshots with delays between them. Handles transient post-
# claim animations that briefly hide a badge.
ocr_max_attempts: 3
ocr_inter_attempt_seconds: 4.0

# --- Lock screen (pattern) --------------------------------------------------
# The AVD boots to a pattern lock. Each cycle the daemon wakes the screen,
# swipes up to reveal the pattern grid, then draws the pattern below before
# launching CODM. Dots are numbered like a phone keypad:
#     1 2 3
#     4 5 6
#     7 8 9
lockscreen:
  enabled: true
  # Verified working on CODM_Pixel9 (1440x3120, Android 15) 2026-07-01.
  # Pattern = center -> top-right -> mid-right -> bottom-right (dots 5,3,6,9).
  pattern: [5, 3, 6, 9]
  # Geometry of the 3x3 grid in DEVICE PIXELS. grid_origin = center of dot 1
  # (top-left). grid_spacing = [dx, dy] between adjacent dot centers. Measured
  # values give dot centers at x=290/720/1150, y=1600/2030/2460.
  grid_origin: [290, 1600]
  grid_spacing: [430, 430]
  # A tap is needed to make the display interactive before swiping — WAKEUP
  # alone leaves a dark always-on state that ignores gestures. Center-ish,
  # lands on empty wallpaper.
  tap_wake_xy: [720, 1500]
  # Swipe up to reveal the pattern bouncer. [x1, y1, x2, y2, duration_ms].
  reveal_swipe: [720, 2500, 720, 800, 200]
  # Pause after drawing the pattern for the unlock animation to finish.
  settle_after_unlock_seconds: 2.0

# --- Login popup (temporary, mid-2026) --------------------------------------
# CODM currently shows a one-time popup on the login screen with a confirm
# button. The flow taps it via the 06_login_popup_confirm.png template. It will
# disappear on its own after a few days — set this to false then, and the
# daemon drops the step entirely (no wasted wait).
login_popup_enabled: true

# When login_popup_enabled is false, this many extra seconds of settle are
# added after a COLD launch to absorb the occasional small on-launch update
# (progress bar, then auto-continues). 0 = no extra wait. Bump to ~60 if
# updates start causing dmz_lobby_check aborts once the popup is gone.
extra_launch_settle_seconds: 0
